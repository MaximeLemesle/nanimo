name: Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      # setup-flutter creates an empty .env so that the analyze and test jobs can
      # run without secrets. A release artifact built on that empty file cannot
      # reach Supabase and reports nothing to Sentry, so the real values are
      # restored here and the job fails loudly when they are missing.
      - name: Restore production .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}
        run: |
          if [ -z "$DOTENV_PRODUCTION" ]; then
            echo "::error::Missing DOTENV_PRODUCTION secret. A release built without it ships an app that cannot reach Supabase."
            exit 1
          fi
          printf '%s' "$DOTENV_PRODUCTION" > .env

      # The upload keystore is deliberately kept out of the repository, so it has
      # to be rebuilt from secrets on the runner. Without it the release build is
      # signed with the debug key and Play rejects the bundle.
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. The release would be signed with the debug key."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release

      # Guards against a silent regression: if the keystore step ever stops
      # working, Gradle falls back to the debug key and the release would look
      # fine while shipping an unpublishable artifact.
      - name: Verify the APK is not debug-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee signer-certs.txt
          if grep -q "CN=Android Debug" signer-certs.txt; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi
          rm signer-certs.txt

      - name: Build App Bundle
        run: flutter build appbundle --release

      # The APK and the AAB are produced in two different directories, and
      # upload-artifact roots the archive at their least common ancestor
      # (build/app/outputs). Downloading it then yields flutter-apk/app-release.apk
      # instead of app-release.apk, which is what the release job expects.
      # Staging both files in one flat directory keeps the downloaded layout
      # predictable.
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp build/app/outputs/bundle/release/app-release.aab dist/
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: artifacts

      - name: Create Github Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const assets = ['app-release.apk', 'app-release.aab'];

            // Both files are checked before the release is created. The previous
            // version skipped missing assets silently, which produced green runs
            // and empty releases from v0.11.0 to v0.14.0. Failing here also
            // avoids leaving an empty release behind on a broken build.
            const missing = assets.filter((a) => !fs.existsSync(`artifacts/${a}`));
            if (missing.length > 0) {
              core.setFailed(
                `Missing artifact(s): ${missing.join(', ')}. ` +
                `Downloaded: ${fs.readdirSync('artifacts').join(', ')}`
              );
              return;
            }

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Nanimo ${tag}`,
              generate_release_notes: true,
              draft: false,
              prerelease: tag.includes('beta') || tag.includes('alpha')
            });

            for (const asset of assets) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `nanimo-${tag}-${asset}`,
                data: fs.readFileSync(`artifacts/${asset}`)
              });
            }
