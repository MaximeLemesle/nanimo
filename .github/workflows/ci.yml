name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: unittests
          name: nanimo
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Enforce coverage threshold (min 80%)
        run: |
          pct=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if (f>0) printf "%.2f", h/f*100; else print "0"}' coverage/lcov.info)
          echo "Total line coverage: ${pct}%"
          if awk -v p="$pct" 'BEGIN{exit !(p+0 < 80)}'; then
            echo "::error::Coverage ${pct}% is below the required 80%"
            exit 1
          fi
          echo "Coverage ${pct}% meets the 80% threshold"
