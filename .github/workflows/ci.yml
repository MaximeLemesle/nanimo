name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      # Each Isar test file runs in its own flutter_tester process. On Linux
      # dlopen("libisar.so") finds nothing, so every process falls back to
      # Isar.initializeIsarCore(download: true) and pulls ~5 MB from GitHub.
      - name: Pre-download Isar Core
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            -o libisar.so \
            'https://github.com/isar/isar/releases/download/3.1.0+1/libisar_linux_x64.so'
          file libisar.so | grep -q 'ELF 64-bit LSB shared object'
          ls -la libisar.so

      - name: Test with coverage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: unittests
          name: nanimo
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Enforce coverage threshold (min 80%)
        run: |
          pct=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if (f>0) printf "%.2f", h/f*100; else print "0"}' coverage/lcov.info)
          echo "Total line coverage: ${pct}%"
          if awk -v p="$pct" 'BEGIN{exit !(p+0 < 80)}'; then
            echo "::error::Coverage ${pct}% is below the required 80%"
            exit 1
          fi
          echo "Coverage ${pct}% meets the 80% threshold"
