version: 2

# Nanimo is maintained by a single developer, so the goal here is a steady and
# reviewable flow rather than exhaustive coverage. Two ecosystems are watched :
# the Dart packages the app actually ships, and the actions the release pipeline
# depends on. Gradle and CocoaPods are deliberately left out, their transitive
# updates arrive through the Flutter SDK bump instead.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Minor and patch bumps are batched into a single pull request : reviewing
    # them one by one costs more attention than the risk they carry. Major bumps
    # stay isolated so each one can be read on its own.
    groups:
      dart-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
